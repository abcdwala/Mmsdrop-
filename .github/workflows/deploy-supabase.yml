name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy all 5 DropMms Pro Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase functions deploy telegram-auth --project-ref "$PROJECT_ID" --no-verify-jwt
          supabase functions deploy content-access --project-ref "$PROJECT_ID" --no-verify-jwt
          supabase functions deploy payment-workflow --project-ref "$PROJECT_ID" --no-verify-jwt
          supabase functions deploy admin-api --project-ref "$PROJECT_ID" --no-verify-jwt
          supabase functions deploy user-actions --project-ref "$PROJECT_ID" --no-verify-jwt
