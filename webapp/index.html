<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>DropMms Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="config.js" onerror="window.DROPMMS_CONFIG = window.DROPMMS_CONFIG || {};"></script>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <div class="brand-title">DropMms Pro</div>
          <div id="auth-subtitle" class="brand-sub">Connecting Telegram Mini App...</div>
        </div>
      </div>
      <div id="role-badge" class="pill hidden"></div>
    </header>

    <div id="config-banner" class="alert-card hidden"></div>
    <div id="announcement-slot"></div>

    <main id="view-root" class="view-root"></main>

    <nav id="bottom-nav" class="bottom-nav" aria-label="Primary Navigation">
      <button class="nav-btn active" data-tab="home" type="button">Home</button>
      <button class="nav-btn" data-tab="explore" type="button">Explore</button>
      <button class="nav-btn" data-tab="premium" type="button">Premium</button>
      <button class="nav-btn" data-tab="profile" type="button">Profile</button>
      <button id="nav-admin-btn" class="nav-btn hidden" data-tab="admin" type="button">Owner</button>
    </nav>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
